# Render Blueprint for the FRONTEND (save as `render.yaml` at the root of
# MajorProject-Code). A static site: free, never sleeps.
services:
  - type: web
    name: sathi-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false            # your API's URL, e.g. https://sathi-api.onrender.com -- baked in at BUILD time, so redeploy after changing it
    routes:
      # The app uses client-side routing (/signin, /post/123, ...). Without this
      # rewrite, refreshing or opening a deep link 404s.
      - type: rewrite
        source: /*
        destination: /index.html